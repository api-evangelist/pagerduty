    CustomFieldsFieldValue:
      type: object
      properties:
        id:
          type: string
          description: Id of the field.
        name:
          type: string
          title: Field Name
          description: The name of the field. May include ASCII characters, specifically lowercase letters, digits, and underescores. The `name` for a Field must be unique.
          maxLength: 50
        type:
          type: string
          description: Determines the type of the reference.
          enum:
          - field_value
        display_name:
          type: string
          description: The human-readable name of the field. This must be unique across an account.
          maxLength: 50
        field_type:
          type: string
          description: The type of data this field contains. In combination with the `data_type` field.
          enum:
          - single_value
          - single_value_fixed
          - multi_value
          - multi_value_fixed
        data_type:
          type: string
          description: The kind of data the custom field is allowed to contain.
          enum:
          - boolean
          - integer
          - float
          - string
          - datetime
          - url
        description:
          type: string
          nullable: true
          description: A description of the data this field contains.
          maxLength: 1000
        value:
          oneOf:
          - type: object
            title: Boolean
            properties:
              value:
                type: boolean
                nullable: true
          - type: object
            title: Float
            properties:
              value:
                type: number
                nullable: true
          - type: object
            title: Integer
            properties:
              value:
                type: integer
                nullable: true
          - type: object
            title: String
            properties:
              value:
                oneOf:
                - type: string
                  maxLength: 200
                  nullable: true
                - type: array
                  items:
                    type: string
                    maxLength: 200
                  maxItems: 10
                  uniqueItems: true
                  nullable: true
          - type: object
            title: Datetime
            properties:
              value:
                type: string
                nullable: true
                format: date-time
          - type: object
            title: Url
            properties:
              value:
                type: string
                format: uri
                maxLength: 200
                nullable: true
      required:
      - id
      - type
      - name
      - value
      - display_name
      - data_type
      - field_type
      - description
    Context:
      type: object
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          description: The type of context being attached to the incident.
