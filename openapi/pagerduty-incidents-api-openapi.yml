            type: array
            readOnly: true
            items:
              $ref: '#/components/schemas/ResponderRequest'
          urgency:
            type: string
            enum:
            - high
            - low
            description: The current urgency of the incident.
          body:
            description: The additional incident body details. Only returned if the `include[]=body` query parameter is provided.
            allOf:
