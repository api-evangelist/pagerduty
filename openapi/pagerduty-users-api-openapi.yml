          $ref: '#/components/responses/TooManyRequests'
components:
  schemas:
    UserSession:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        user_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The date/time the user session was first created.
        type:
          type: string
          readOnly: true
          description: The type of the session
          enum:
          - browser
          - oauth
        summary:
          type: string
          readOnly: true
          description: The summary of the session
      required:
      - id
      - user_id
      - created_at
      - type
      - summary
      example:
        id: PXPGF42
        user_id: PXPGF42
        created_at: '2018-10-06T21:30:42Z'
        summary: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_4) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/74.0.3729.131 Safari/537.36
        type: browser
    NotificationRule:
      allOf:
      - $ref: '#/components/schemas/Tag/allOf/0'
      - type: object
        description: A rule for contacting the user.
        properties:
          type:
            type: string
            description: The type of object being created.
            default: assignment_notification_rule
            enum:
            - assignment_notification_rule
          start_delay_in_minutes:
            type: integer
            description: The delay before firing the rule, in minutes.
            minimum: 0
          contact_method:
            $ref: '#/components/schemas/ContactMethodReference'
          urgency:
            type: string
            enum:
            - high
            - low
            description: Which incident urgency this rule is used for. Account must have the `urgencies` ability to have a low urgency notification rule.
        required:
        - start_delay_in_minutes
        - urgency
        - contact_method
        - type
        example:
          type: assignment_notification_rule
          start_delay_in_minutes: 0
          contact_method:
            id: PXPGF42
            type: email_contact_method_reference
          urgency: high
    LicenseWithCounts:
      allOf:
      - type: object
        required:
        - id
        - description
        - name
        - valid_roles
        properties:
          id:
            type: string
            description: Uniquely identifies the resource
          description:
            type: string
            description: 'Description of the License. May include the names of add-ons associated with

              the License, if there are any.

              '
          name:
            type: string
            description: 'Name of the License.

              '
          valid_roles:
            type: array
            description: The roles a User with this License can have
            items:
              type: string
          role_group:
            type: string
            enum:
            - FullUser
            - Stakeholder
            description: Indicates whether this License is assignable to full or stakeholder Users
            example: FullUser
          type:
            type: string
            description: Type of object
          self:
            type: string
            description: API URL to access the License
          html_url:
            type: string
            description: HTML URL to access the License
          summary:
            type: string
            description: Summary of the License
      - type: object
        properties:
          current_value:
            type: integer
            description: How many of these Licenses are currently allocated to Users
          allocations_available:
            type: integer
            nullable: true
            description: 'How many of these licenses are available to be allocated to a user. If this

              value is "null" then there is no limit on the number of allocations allowed.

              '
    NotificationSubscription:
      title: NotificationSubscription
      description: An object describing the relationship of a NotificationSubscriber and a NotificationSubscribable.
      type: object
      properties:
        subscriber_id:
          type: string
          description: The ID of the entity being subscribed
        subscriber_type:
          type: string
          description: The type of the entity being subscribed
          enum:
          - user
          - team
        subscribable_id:
          type: string
          description: The ID of the entity being subscribed to
        subscribable_type:
          type: string
          description: The type of the entity being subscribed to
          enum:
          - incident
          - business_service
        account_id:
          type: string
          description: The ID of the account belonging to the subscriber entity
      x-examples:
        example-1:
          subscriber_id: string
          subscriber_type: user
          subscribable_id: string
          subscribable_type: incident
          account_id: string
    PhoneContactMethod:
      description: The Phone Contact Method of the User, used for Voice or SMS.
      allOf:
      - $ref: '#/components/schemas/ContactMethod'
      - type: object
        properties:
          type:
            type: string
            enum:
            - phone_contact_method
            - sms_contact_method
          country_code:
            type: integer
            description: The 1-to-3 digit country calling code.
            minimum: 1
            maximum: 1999
          enabled:
            type: boolean
            description: If true, this phone is capable of receiving SMS messages.
            readOnly: true
          blacklisted:
            type: boolean
            description: If true, this phone has been blacklisted by PagerDuty and no messages will be sent to it.
            readOnly: true
        required:
        - country_code
        example:
          type: phone_contact_method
          label: work
          country_code: 123
          address: '1234567'
    AuditMetadata:
      type: object
      properties:
        messages:
          type: array
          nullable: true
          items:
            type: string
            example: Message about the result
    TeamReference:
      allOf:
      - $ref: '#/components/schemas/Reference'
      - type: object
        properties:
          type:
            type: string
            enum:
            - team_reference
    StatusUpdateNotificationRule:
      type: object
      description: A rule for contacting the user for Incident Status Updates.
      properties:
        contact_method:
          $ref: '#/components/schemas/ContactMethodReference'
      required:
      - contact_method
      example:
        contact_method:
          id: PXPGF42
          type: email_contact_method_reference
    PushContactMethod:
      description: The Push Contact Method of the User.
      allOf:
      - $ref: '#/components/schemas/ContactMethod'
      - type: object
        properties:
          type:
            type: string
            enum:
            - push_notification_contact_method
          device_type:
            type: string
            description: The type of device.
            enum:
            - android
            - ios
            readOnly: true
          sounds:
            type: array
            items:
              $ref: '#/components/schemas/PushContactMethodSound'
          created_at:
            type: string
            format: date-time
            description: Time at which the contact method was created.
          blacklisted:
            type: boolean
            description: If true, this phone has been blacklisted by PagerDuty and no messages will be sent to it.
            readOnly: true
        required:
        - device_type
        example:
          type: push_notification_contact_method
          label: work
          device_type: android
          address: '12341234'
    HandoffNotificationRule:
      type: object
      description: A rule for contacting the user for Handoff Notifications.
      properties:
        id:
          type: string
          readOnly: true
        notify_advance_in_minutes:
          type: integer
          description: The delay before firing the rule, in minutes.
          minimum: 0
        handoff_type:
          type: string
          description: The type of handoff being created.
          default: both
          enum:
          - both
          - oncall
          - offcall
        contact_method:
          $ref: '#/components/schemas/ContactMethodReference'
      required:
      - id
      - handoff_type
      - contact_method
      example:
        id: PXPGF42
        notify_advance_in_minutes: 180
        handoff_type: both
        contact_method:
          id: PXPGF42
          type: email_contact_method_reference
    NotificationSubscriptionWithContext:
      title: NotificationSubscriptionWithContext
      type: object
      description: An object describing the relationship of a NotificationSubscriber and a NotificationSubscribable with additional context on status of subscription attempt.
      x-examples:
        example-1:
          subscriber_id: string
          subscriber_type: user
          subscribable_id: string
          subscribable_type: incident
          account_id: string
          result: success
      properties:
        subscriber_id:
          type: string
          description: The ID of the entity being subscribed
        subscriber_type:
          type: string
          enum:
          - user
          - team
          description: The type of the entity being subscribed
        subscribable_id:
          type: string
          description: The ID of the entity being subscribed to
        subscribable_type:
          type: string
          enum:
          - incident
          - business_service
          description: The type of the entity being subscribed to
        account_id:
          type: string
          description: The type of the entity being subscribed to
        result:
          type: string
          enum:
          - success
          - duplicate
          - unauthorized
          description: The resulting status of the subscription
    ContactMethod:
      allOf:
      - $ref: '#/components/schemas/Tag/allOf/0'
      - type: object
        description: The method to contact a user.
        properties:
          type:
            type: string
            description: The type of contact method being created.
            enum:
            - email_contact_method
            - phone_contact_method
            - push_notification_contact_method
            - sms_contact_method
          label:
            type: string
            description: The label (e.g., "Work", "Mobile", etc.).
          address:
            type: string
            description: 'The "address" to deliver to: email, phone number, etc., depending on the type.'
        discriminator:
          propertyName: type
        required:
        - type
        - label
        - address
    LicenseReference:
      allOf:
      - $ref: '#/components/schemas/Reference'
      - type: object
        properties:
          type:
            type: string
            enum:
            - license_reference
    CursorPagination:
      type: object
      properties:
        limit:
          type: integer
          description: The minimum of the `limit` parameter used in the request or the maximum request size of the API.
          readOnly: true
        next_cursor:
          type: string
          description: 'An opaque string than will deliver the next set of results when provided as the `cursor` parameter in a subsequent request.  A `null` value for this field indicates that there are no additional results.

            '
          example: dXNlcjaVMzc5V0ZYTlo=
          nullable: true
          readOnly: true
      required:
      - limit
      - next_cursor
    ContactMethodReference:
      allOf:
      - $ref: '#/components/schemas/Reference'
      - type: object
        properties:
          type:
            type: string
            enum:
            - email_contact_method_reference
            - phone_contact_method_reference
            - push_notification_contact_method_reference
            - sms_contact_method_reference
    NotificationRuleReference:
      allOf:
      - $ref: '#/components/schemas/Reference'
      - type: object
        properties:
          type:
            type: string
            enum:
            - assignment_notification_rule_reference
    User:
      allOf:
      - $ref: '#/components/schemas/Tag/allOf/0'
      - type: object
        properties:
          name:
            type: string
            description: The name of the user.
            maxLength: 100
          type:
            type: string
            description: The type of object being created.
            default: user
            enum:
            - user
          email:
            type: string
            format: email
            description: The user's email address.
            minLength: 6
            maxLength: 100
          time_zone:
            type: string
            format: tzinfo
            description: The preferred time zone name. If null, the account's time zone will be used.
          color:
            type: string
            description: The schedule color.
          role:
            description: The user role. Account must have the `read_only_users` ability to set a user as a `read_only_user` or a `read_only_limited_user`, and must have advanced permissions abilities to set a user as `observer` or `restricted_access`.
            type: string
            enum:
            - admin
            - limited_user
            - observer
            - owner
            - read_only_user
            - restricted_access
            - read_only_limited_user
            - user
          avatar_url:
            type: string
            format: url
            description: The URL of the user's avatar.
            readOnly: true
          description:
            type: string
            description: The user's bio.
            nullable: true
          invitation_sent:
            type: boolean
            readOnly: true
            description: If true, the user has an outstanding invitation.
          job_title:
            type: string
            description: The user's title.
            maxLength: 100
          teams:
            type: array
            readOnly: true
            description: The list of teams to which the user belongs. Account must have the `teams` ability to set this.
            items:
              $ref: '#/components/schemas/TeamReference'
          contact_methods:
            type: array
            readOnly: true
            description: The list of contact methods for the user.
            items:
              $ref: '#/components/schemas/ContactMethodReference'
          notification_rules:
            readOnly: true
            type: array
            description: The list of notification rules for the user.
            items:
              $ref: '#/components/schemas/NotificationRuleReference'
        required:
        - name
        - email
        - type
        example:
          type: user
          name: Earline Greenholt
          email: 125.greenholt.earline@graham.name
          time_zone: America/Lima
          color: green
          role: admin
          job_title: Director of Engineering
          avatar_url: https://secure.gravatar.com/avatar/1d1a39d4635208d5664082a6c654a73f.png?d=mm&r=PG
          description: I'm the boss
    AuditRecord:
      type: object
      readOnly: true
      description: An Audit Trail record
      properties:
        id:
          type: string
        self:
          type: string
          nullable: true
          description: Record URL.
        execution_time:
          type: string
          format: date-time
          description: The date/time the action executed, in ISO8601 format and millisecond precision.
        execution_context:
          type: object
          description: Action execution context
          properties:
            request_id:
              type: string
              nullable: true
              description: Request Id
            remote_address:
              type: string
              nullable: true
              description: remote address
          nullable: true
        actors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Reference'
        method:
          type: object
          description: The method information
          properties:
            description:
              type: string
              nullable: true
            truncated_token:
              description: Truncated token containing the last 4 chars of the token's actual value.
              type: string
              nullable: true
              example: 3xyz
            type:
              $ref: '#/components/parameters/audit_method_type/schema'
          required:
          - type
        root_resource:
          $ref: '#/components/schemas/Reference'
        action:
          type: string
          example: create
        details:
          type: object
          nullable: true
          description: 'Additional details to provide further information about the action or

            the resource that has been audited.

            '
          properties:
            resource:
              $ref: '#/components/schemas/Reference'
            fields:
              description: 'A set of fields that have been affected.

                The fields that have not been affected MAY be returned.

                '
              type: array
              nullable: true
              items:
                type: object
                description: "Information about the affected field.\nWhen available, field's before and after values are returned:\n  \n#### Resource creation\n- `value` MAY be returned\n\n#### Resource update\n- `value` MAY be returned\n- `before_value` MAY be returned\n\n#### Resource deletion\n- `before_value` MAY be returned\n"
                properties:
                  name:
                    type: string
                    description: Name of the resource field
                    example: name
                  description:
                    type: string
                    nullable: true
                    description: Human readable description of the resource field
                    example: First and Last name
                  value:
                    type: string
                    nullable: true
                    description: new or updated value of the field
                    example: Jonathan
                  before_value:
                    type: string
                    nullable: true
                    description: previous or deleted value of the field
                    example: John
                required:
                - name
            references:
              description: A set of references that have been affected.
              type: array
              nullable: true
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Name of the reference field
                    example: team_members
                  description:
                    type: string
                    nullable: true
                    description: Human readable description of the references field
                    example: First and Last name
                  added:
                    type: array
                    nullable: true
                    items:
                      $ref: '#/components/schemas/Reference'
                  removed:
                    type: array
                    nullable: true
                    items:
                      $ref: '#/components/schemas/Reference'
                required:
                - name
          required:
          - resource
      required:
      - id
      - execution_time
      - method
      - root_resource
      - action
    Reference:
      allOf:
      - $ref: '#/components/schemas/Tag/allOf/0'
      - type: object
        required:
        - type
        - id
    AuditRecordResponseSchema:
      allOf:
      - type: object
        properties:
          records:
            type: array
            items:
              $ref: '#/components/schemas/AuditRecord'
          response_metadata:
            nullable: true
            anyOf:
            - $ref: '#/components/schemas/AuditMetadata'
        required:
        - records
      - $ref: '#/components/schemas/CursorPagination'
    PushContactMethodSound:
      type: object
      properties:
        type:
          type: string
          description: The type of sound.
          enum:
          - alert_high_urgency
          - alert_low_urgency
        file:
          type: string
          description: The sound file name.
    EmailContactMethod:
      description: The Email Contact Method of the User.
      allOf:
      - $ref: '#/components/schemas/ContactMethod'
      - type: object
        properties:
          type:
            type: string
            enum:
            - email_contact_method
          send_short_email:
            type: boolean
            description: Send an abbreviated email message instead of the standard email output. Useful for email-to-SMS gateways and email based pagers.
            default: false
        example:
          type: email_contact_method
          label: work
          address: grady.haylie.126@hickle.net
          send_short_email: false
    NotificationSubscribable:
      title: NotificationSubscribable
      description: A reference of a subscribable entity.
      type: object
      properties:
        subscribable_id:
          type: string
          description: The ID of the entity to subscribe to
        subscribable_type:
          type: string
          description: The type of the entity being subscribed to
          enum:
          - incident
          - business_service
      example:
        subscribable_id: PD1234
        subscribable_type: incident
    Pagination:
      type: object
      properties:
        offset:
          type: integer
          description: Echoes offset pagination property.
          readOnly: true
        limit:
          type: integer
          description: Echoes limit pagination property.
          readOnly: true
        more:
          type: boolean
          description: Indicates if there are additional records to return
          readOnly: true
        total:
          type: integer
          description: The total number of records matching the given query.
          nullable: true
          readOnly: true
    Tag:
      allOf:
      - type: object
        properties:
          id:
            type: string
            readOnly: true
          summary:
            type: string
            nullable: true
            readOnly: true
            description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
          type:
            type: string
            readOnly: true
            description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
          self:
            type: string
            nullable: true
            readOnly: true
            format: url
            description: the API show URL at which the object is accessible
          html_url:
            type: string
            nullable: true
            readOnly: true
            format: url
            description: a URL at which the entity is uniquely displayed in the Web app
      - type: object
        properties:
          type:
            type: string
            description: The type of object being created.
            default: tag
            enum:
            - tag
          label:
            type: string
            description: The label of the tag.
            maxLength: 191
        required:
        - label
        - type
        example:
          type: tag
          label: Batman
  parameters:
    team_ids:
      name: team_ids[]
      in: query
      description: An array of team IDs. Only results related to these teams will be returned. Account must have the `teams` ability to use this parameter.
      explode: true
      schema:
        type: array
        items:
          type: string
        uniqueItems: true
    type:
      name: type
      in: path
      description: The session type for the user session ID.
      required: true
      schema:
        type: string
    include_user:
      name: include[]
      in: query
      description: Array of additional Models to include in response.
      explode: true
      schema:
        type: string
        enum:
        - contact_methods
        - notification_rules
        - teams
        - subdomains
        uniqueItems: true
    from_header:
      name: From
      in: header
      description: The email address of a valid user associated with the account making the request.
      required: true
      schema:
        type: string
        format: email
    audit_since:
      name: since
      in: query
      description: The start of the date range over which you want to search. If not specified, defaults to `now() - 24 hours` (past 24 hours)
      schema:
        type: string
        format: date-time
    query:
      name: query
